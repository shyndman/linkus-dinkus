name: Publish OCI image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Validate and publish linux/amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Calculate image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "${image}:latest"
            elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "${image}:${GITHUB_REF#refs/tags/}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build image for validation
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: linkus-dinkus:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate installed runtime and service layout
        run: |
          docker run --rm --entrypoint /bin/sh linkus-dinkus:validation -ec '
            node --version
            bun --version
            pnpm --version
            /sbin/init --version
            test -x /opt/linkus-dinkus/.tools/camoufox-cli/.venv/bin/camou
            test -x /opt/linkus-dinkus/.tools/spreadsheet-mcp/.venv/bin/spreadsheet-mcp
            test -L /etc/systemd/user/default.target.wants/linkus-dinkus-bootstrap.service
            test -L /etc/systemd/user/default.target.wants/linkus-dinkus-bookmarks.service
            test -f /var/lib/systemd/linger/linkus-dinkus
            runuser -u linkus-dinkus -- test -w /var/lib/linkus-dinkus
            runuser -u linkus-dinkus -- test -w /usr/lib/linkus-dinkus/cache
            runuser -u linkus-dinkus -- test -r /opt/linkus-dinkus/.omp/mcp.json
            runuser -u linkus-dinkus -- node --import tsx --eval "console.log(process.version)"
          '
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
